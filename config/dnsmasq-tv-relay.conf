# TV relay: DHCP + DNS for the device behind enP4p65s0.
# All of the device's name resolution flows through this Pi, so tvsniff
# sees every lookup on enP4p65s0.
interface=enP4p65s0
bind-dynamic
local-service
dhcp-authoritative
dhcp-range=192.168.2.10,192.168.2.100,255.255.255.0,12h
dhcp-option=option:router,192.168.2.1
dhcp-option=option:dns-server,192.168.2.1
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
log-dhcp

# Forward DNS to the home router (wlan0 uplink).
no-resolv
server=192.168.1.1
cache-size=1000
