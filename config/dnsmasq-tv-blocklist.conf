# TV containment -- DNS blackhole.
# Each line sinks a domain AND all its subdomains to 0.0.0.0 (resolves,
# but unconnectable -- avoids pushing apps to DoH fallback).
# Apply changes with:  sudo systemctl restart dnsmasq
