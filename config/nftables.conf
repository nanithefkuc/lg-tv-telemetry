#!/usr/sbin/nft -f
# TV relay: NAT router + containment firewall.
# wlan0 = uplink, enP4p65s0 = TV side (192.168.2.0/24).
#
# Containment policy (grows incrementally; goal: contain the vendor,
# not break the TV):
#   - @blocked_v4   destination IPs to blackhole (add vendor CIDRs here)
#   - DNS blackhole dnsmasq: /etc/dnsmasq.d/tv-blocklist.conf
#   - lan guard     TV may not ICMP-probe 192.168.0.0/16
# Everything else: allowed.

flush ruleset

table inet tvrelay {
    set tvlan {
        type ipv4_addr
        flags interval
        elements = { 192.168.2.0/24 }
    }

    set blocked_v4 {
        type ipv4_addr
        flags interval
        elements = {
            173.233.81.175,              # hardcoded static site
            34.117.13.189,               # discovery.meethue.com probe (no Hue here)
            3.39.34.70, 15.165.157.0,    # AWS kr: nextlgsdp / wiselg hosts
            13.125.1.66, 13.125.147.86, 13.125.151.32, 13.124.167.186,
            3.39.65.189, 3.36.243.207, 54.116.132.89, 54.117.15.181,
            54.116.99.53, 3.34.120.24, 43.200.132.56, 43.202.98.98,   # LG fleet (kr/ap)
            3.34.206.243, 13.125.181.130, 13.209.123.235, 3.37.151.244, # mqtt 8883 hosts
            44.207.185.112, 52.205.51.211, 35.173.7.10, 44.208.157.219, # hash-SNI ec2 telemetry
            35.165.63.51, 54.189.185.191, 35.163.192.149, 54.213.101.195,
            52.24.26.117, 52.10.248.239, 35.82.23.172, 52.10.208.126,
            35.82.63.100, 54.189.176.25,                # nameless AWS ec2
            34.212.185.237, 44.242.131.93, 44.228.67.58, 52.33.247.19,
            44.226.179.188,                           # logs.netflix.com hosts (cached-IP seal)
            52.37.176.140, 44.239.254.161, 50.112.122.241,  # nameless nrdp-cloud (whack-a-mole round 2)
            67.231.244.222,                            # prov-lb/prov-geo-aws.alphonso.tv (TLS-confirmed)
        }
    }

    chain prerouting {
        type nat hook prerouting priority dstnat; policy accept;
        ip saddr @tvlan udp dport 53 counter dnat to 192.168.2.1 comment "force dns"
        ip saddr @tvlan tcp dport 53 counter dnat to 192.168.2.1 comment "force dns"
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
        ip saddr @tvlan tcp dport 8883 counter drop comment "tv mqtt iot"
        ip daddr @blocked_v4 counter drop comment "blackholed dst"
        ip saddr @tvlan ip daddr 192.168.0.0/16 icmp type echo-request counter drop comment "tv lan probe"
        ip saddr @tvlan counter comment "tv to internet"
        ip daddr @tvlan counter comment "internet to tv"
    }

    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "wlan0" ip saddr @tvlan counter masquerade comment "tv nat"
    }
}
